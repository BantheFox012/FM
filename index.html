const money=(x,d=1)=>`${x<0?'−':''}${sym}${n(Math.abs(x)/scale,d)}${m.currency==='INR'?'L':'m'}`,amount=x=>x===null?'—':Math.abs(x)<0.00001?'0.0':x<0?'('+n(-x/scale)+')':n(x/scale);
const field=(label,path,o={})=>{const v=get(m,path),id='f-'+path.replaceAll('.','-'),type=o.type||'number';return`<div class="field ${o.wide?'wide':''}"><label for="${id}">${esc(label)}${o.unit?` <span class="muted" style="font-weight:400">· ${esc(o.unit)}</span>`:''}</label>${type==='select'?`<select id="${id}" data-p="${path}">${o.options.map(([a,b])=>`<option value="${a}" ${String(v)===String(a)?'selected':''}>${b}</option>`).join('')}</select>`:type==='textarea'?`<textarea id="${id}" data-p="${path}" maxlength="4000">${esc(v)}</textarea>`:type==='checkbox'?`<label style="font-weight:400;display:flex;gap:9px;align-items:center"><input id="${id}" data-p="${path}" type="checkbox" ${v?'checked':''} style="width:auto;accent-color:var(--green)">${esc(o.text||'Enabled')}</label>`:`<input id="${id}" data-p="${path}" type="${type}" value="${esc(v??'')}" ${type==='number'?`step="${o.step??'any'}" min="${o.min??0}" max="${o.max??1e15}" ${o.optional?'data-optional="true"':'required'}`:'maxlength="250"'} ${o.placeholder?`placeholder="${esc(o.placeholder)}"`:''}>`}${o.help?`<small>${esc(o.help)}</small>`:''}</div>`};
const head=(eye,title,desc,action='')=>`<div class="heading-row"><div><div class="eyebrow">${eye}</div><h1>${title}</h1><p class="subtext">${desc}</p></div>${action}</div>`;
const card=(title,desc,body)=>`<section class="card section-space"><div class="card-head"><div><h2>${title}</h2>${desc?`<p class="subtext">${desc}</p>`:''}</div></div>${body}</section>`;
const controls=()=>`<div class="controls-row"><div class="segmented" role="group" aria-label="Model scenario">${m.scenarios.map(s=>`<button data-scenario="${s.id}" class="${scenario===s.id?'active':''}" aria-pressed="${scenario===s.id}">${esc(s.name)}</button>`).join('')}</div><span class="subtext">${m.currency} · amounts in ${unit}</span></div>`;
const metric=(a,b,d,h=a)=>`<div class="metric"><div class="metric-label">${a}<span title="${esc(h)}">${icon('info')}</span></div><div class="metric-value">${b}</div><div class="metric-foot">${d}</div></div>`;
const table=(defs,data=r.rows)=>`<div class="table-wrap"><table><thead><tr><th>${m.currency} · ${unit}</th>${data.map(v=>`<th>${v.year}</th>`).join('')}</tr></thead><tbody>${defs.map(([label,key,cls,format])=>`<tr class="${cls||''}"><td>${esc(label)}</td>${data.map((v,i)=>{let x=typeof key==='function'?key(v,i):v[key];return`<td>${format==='ratio'?(x===null?'—':n(x,2)+'×'):format==='number'?n(x):amount(x)}</td>`}).join('')}</tr>`).join('')}</tbody></table></div>`;
function chart(){const d=r.rows.slice(1),w=650,h=245,l=48,ri=15,top=22,bottom=38,mi=Math.min(0,...d.map(v=>v.ebitda)),ma=Math.max(1,...d.map(v=>v.revenue),...d.map(v=>v.ebitda))*1.15,y=v=>top+(ma-v)/(ma-mi)*(h-top-bottom),x=i=>l+i*(w-l-ri)/Math.max(1,d.length-1),line=k=>d.map((v,i)=>`${i?'L':'M'}${x(i)},${y(v[k])}`).join('');return`<svg class="chart" viewBox="0 0 ${w} ${h}" role="img" aria-label="Revenue and EBITDA over the forecast">${Array.from({length:5},(_,i)=>{const v=mi+(ma-mi)*i/4,yy=y(v);return`<line x1="${l}" x2="${w-ri}" y1="${yy}" y2="${yy}" stroke="#edf0e9"/><text x="${l-9}" y="${yy+3}" text-anchor="end">${n(v/scale,0)}</text>`}).join('')}<path d="${line('revenue')}L${x(d.length-1)},${y(0)}L${l},${y(0)}Z" fill="#eaf0e3"/><path d="${line('ebitda')}L${x(d.length-1)},${y(0)}L${l},${y(0)}Z" fill="#d5e2c7" opacity=".65"/><path d="${line('revenue')}" fill="none" stroke="#4e7965" stroke-width="2.7"/><path d="${line('ebitda')}" fill="none" stroke="#9eb783" stroke-width="2.3"/>${d.map((v,i)=>`<circle cx="${x(i)}" cy="${y(v.revenue)}" r="3" fill="#4e7965"><title>${v.year}: Revenue ${money(v.revenue)}, EBITDA ${money(v.ebitda)}</title></circle>${d.length<=12||i%Math.ceil(d.length/8)===0||i===d.length-1?`<text x="${x(i)}" y="${h-12}" text-anchor="middle">${v.year}</text>`:''}`).join('')}</svg>`}
function overview(){const first=m.streams[0],quick=first?specs[first.type].fields.slice(0,3):[],all=[...m.streams,...m.costs,...m.drivers],pending=all.filter(x=>!x.reviewed).length;return head('PROJECT OVERVIEW','Your project, in numbers.',`A clearer picture of ${esc(m.name.toLowerCase())}, one assumption at a time.`,`<span class="badge"><span class="dot"></span> ${m.years}-year projection</span>`)+(pending?`<div class="notice">${icon('info')} You’re exploring an example. Replace the assumptions with your project’s numbers.<button class="text-button" data-nav="checks">${pending} groups to review →</button></div>`:'')+controls()+`<div class="metrics">${metric('Initial investment',money(r.initialInvestment),'Assets purchased before operations','Setup capital expenditure, excluding cash reserve.')}${metric('Year 1 revenue',money(r.rows[1].revenue),`${m.startYear} · ${m.streams.length} income streams`)}${metric('Project IRR',r.projectIrr.value===null?'—':pct(r.projectIrr.value),r.projectIrr.value===null?'Not defined · see returns':`NPV ${money(r.npv)} at ${m.discount}%`,r.projectIrr.reason||'Annualized return on unlevered project cash flows.')}${metric('Minimum debt coverage',r.minDscr===null?'—':n(r.minDscr,2)+'×',r.minDscr===null?'No loan repayments':r.minDscr<1?'<span style="color:var(--orange)">Below 1× · review funding</span>':'Cash available ÷ debt service','DSCR: cash after taxes, working capital and maintenance capex divided by interest and principal.')}</div><div class="grid-two"><section class="card"><div class="card-head"><div><h2>The road ahead</h2><p class="subtext">Revenue and operating profit over time</p></div><div class="chart-legend"><span><i style="background:#4e7965"></i>Revenue</span><span><i style="background:#a4ba8d"></i>EBITDA</span></div></div>${chart()}<div class="card-footer"><span>Operating profit before interest, tax & depreciation</span><button class="text-button" data-nav="statements">View statements →</button></div></section><section class="card"><div class="card-head"><div><h2>Your key assumptions</h2><p class="subtext">${first?esc(first.name):'Add a revenue stream to begin'}</p></div><span class="badge">Editable</span></div>${quick.length?quick.map(([k,label,u,min,max,help])=>`<div class="quick-field"><div><label for="quick-${k}">${label}</label><small>${esc(help)}</small></div><div class="input-unit"><input id="quick-${k}" type="number" step="any" required min="${min}" max="${max}" data-p="streams.0.inputs.${k}" value="${first.inputs[k]}"><span>${u.replace('sq ft','ft²')}</span></div></div>`).join(''):'<div class="empty">Add the inputs that drive your income.</div>'}<div class="card-footer"><span>Changes update your whole model</span><button class="text-button" data-nav="revenue">Edit all →</button></div></section></div><section class="card"><div class="card-head"><div><h2>Build a model that fits your project</h2><p class="subtext">Work through each part. Your financial statements come together automatically.</p></div><span class="badge">6 connected building blocks</span></div><div class="steps">${[['setup','Define your project','Choose currency, timeline and custom drivers.'],['revenue','How will you earn?','Add rent, production, sales, or your own formula.'],['costs','What will it cost?','Plan staffing, utilities, materials and more.'],['investment','How will you fund it?','Set up investment, loans and equity.'],['statements','See the full picture','Review profit, cash flow and the balance sheet.'],['scenarios','Test what could change','Explore different assumptions and outcomes.']].map(([id,a,b],i)=>`<button class="step" data-nav="${id}"><span class="step-number">0${i+1}</span><span><strong>${a}</strong><p>${b}</p></span><span class="arrow">↗</span></button>`).join('')}</div></section><div class="footer-note">Forecast based on your assumptions · Annual model · ${m.liquidate?'Exit proceeds included':'No terminal value assumed'} · ${esc(r.sc.name)}</div>`}
function setup(){return head('BUILD YOUR MODEL / 01','Define your project.','Set the ground rules. Enter all money inputs in full currency units.')+card('Project basics','Currency changes labels only; it does not convert amounts or select tax rules.',`<div class="form-grid">${field('Project name','name',{type:'text'})}${field('Currency','currency',{type:'select',options:[['INR','INR — Indian rupee'],['USD','USD — US dollar'],['EUR','EUR — Euro'],['GBP','GBP — British pound'],['AED','AED — UAE dirham']]})}${field('First operating year','startYear',{min:1900,max:2200,step:1})}${field('Forecast length','years',{unit:'years',min:1,max:30,step:1,help:'Setup is year 0; operations start in year 1.'})}${field('Discount rate','discount',{unit:'%',max:100,help:'Your required return, used to value future cash today (NPV).'})}${field('Corporate tax rate','tax',{unit:'%',max:100,help:'Planning tax rate. Check the rate applicable to your project.'})}${field('Carry forward tax losses','lossCarry',{type:'checkbox',text:'Offset future profits with past losses',help:'Simplified unlimited carryforward with full offset; book and tax depreciation are assumed equal.'})}${field('Project notes','notes',{type:'textarea',wide:true,help:'Record scope, source documents, exclusions and decisions.'})}</div>`)+card('Working capital','Cash tied up between buying supplies and collecting payments.',`<div class="form-grid">${field('Sales made on credit','creditShare',{unit:'%',max:100,help:'0 for cash-only sales. Receivables apply to this share of revenue.'})}${field('Customer collection period','ar',{unit:'days',max:365,help:'Days credit customers take to pay.'})}${field('Inventory holding period','inventoryDays',{unit:'days',max:365,help:'Applied to costs marked as inventory eligible.'})}${field('Supplier payment period','ap',{unit:'days',max:365,help:'Applied to costs marked as eligible for supplier credit.'})}</div>`)+card('At the end of the forecast','Choose whether the project continues or is sold and closed.',`<div class="form-grid">${field('Close and sell in the final year','liquidate',{type:'checkbox',text:'Sell assets, recover working capital and repay all debt',help:'When off, no exit value or automatic distribution of retained cash is included.'})}${field('Gross asset sale proceeds','terminalValue',{unit:m.currency,help:'Used only when closing is enabled. Disposal gains/losses follow the simplified tax policy.'})}</div>`)+`<div class="heading-row"><div><h2>Your own assumptions</h2><p class="subtext">Add a project-specific driver, then use its key in a formula.</p></div><button class="btn" data-action="add-driver">${icon('plus')} Add driver</button></div>${m.drivers.map((d,i)=>`<section class="module-card"><div class="module-title"><div><strong>${esc(d.name)}</strong><small>Formula key: <span class="mono">${esc(d.key)}</span></small></div><button class="icon-button" data-delete="drivers.${i}" aria-label="Delete ${esc(d.name)}">×</button></div><div class="module-body"><div class="form-grid">${field('Assumption name',`drivers.${i}.name`,{type:'text'})}${field('Formula key',`drivers.${i}.key`,{type:'text',help:'Lowercase letters, numbers and underscores; start with a letter.'})}${field('Starting value',`drivers.${i}.value`,{min:-1e15})}${field('Unit',`drivers.${i}.unit`,{type:'text'})}${field('Annual growth',`drivers.${i}.growth`,{unit:'%',min:-99,max:100})}${field('Source / explanation',`drivers.${i}.note`,{type:'textarea'})}${field('Assumption review',`drivers.${i}.reviewed`,{type:'checkbox',text:'I have checked this assumption'})}</div><details><summary>Year-by-year overrides</summary><p class="subtext">Blank uses the starting value and annual growth.</p><div class="annual-inputs">${Array.from({length:m.years},(_,j)=>field(String(m.startYear+j),`drivers.${i}.overrides.${j}`,{min:-1e15,optional:true,placeholder:n(r.drivers[i].values[j],0)})).join('')}</div></details></div></section>`).join('')||'<div class="empty">Create a driver such as rooms, footfall, water_usage or tariff.</div>'}`}
function modules(kind){const rev=kind==='streams';return head(`BUILD YOUR MODEL / ${rev?'02':'03'}`,rev?'How will your project earn?':'Plan the cost of running it.',rev?'Combine different income streams in the same financial model.':'Manufacturing material costs are already linked to their revenue streams.',`<button class="btn primary" data-action="add-${kind}">${icon('plus')} Add ${rev?'revenue stream':'cost'}</button>`)+`<div class="notice">${icon('info')} Enter base amounts in ${m.currency}. Scenario changes are applied separately.<button class="text-button" data-nav="setup">Custom drivers →</button></div>${m[kind].map((s,i)=>{const base=`${kind}.${i}`,first=rev?r.streams[i].values[1].revenue:r.costs[i].values[1];return`<section class="module-card"><details ${i===0?'open':''}><summary class="module-title" style="color:var(--ink)"><div><strong>${esc(s.name)}</strong><small>${specs[s.type].label} · ${specs[s.type].hint}</small></div><span class="badge ${s.reviewed?'':'warn'}">${s.reviewed?'Reviewed':'Needs review'}</span></summary><div class="module-body"><div class="form-grid">${field('Name',`${base}.name`,{type:'text',wide:true})}${specs[s.type].fields.map(([k,label,u,min,max,help])=>field(label,`${base}.inputs.${k}`,{unit:u.startsWith('/')?m.currency+u:u,min,max,help})).join('')}${s.type==='formula'?`${field('Formula',`${base}.formula`,{type:'textarea',wide:true,help:'Use arithmetic, parentheses, min(), max(), abs() and the keys below. Percentages must be divided by 100.'})}<div class="field wide"><div class="pill-list">${m.drivers.map(d=>`<span class="pill" title="${esc(d.name)}">${esc(d.key)}</span>`).join('')}<span class="pill">year</span>${!rev?`<span class="pill">revenue</span>${m.streams.map(x=>`<span class="pill" title="${esc(x.name)} output">q_${x.id}</span><span class="pill" title="${esc(x.name)} raw input">input_${x.id}</span><span class="pill" title="${esc(x.name)} revenue">sales_${x.id}</span>`).join('')}`:''}</div><small>${rev?'Revenue formulas use custom drivers and year only. Price and volume scenario factors apply to the result.':'Cost formulas can use revenue and stream quantity keys. The cost scenario factor applies to the result.'}</small></div>`:''}${field('First active year',`${base}.start`,{unit:'model year',min:1,max:30,step:1,help:'Year 1 = '+m.startYear})}${field('Last active year',`${base}.end`,{unit:'model year',min:s.start,max:30,step:1})}${(!rev||s.type==='processing')?field('Inventory eligible',`${base}.inventory`,{type:'checkbox',text:'Include this cost in inventory'}):''}${(!rev||s.type==='processing')?field('Supplier credit eligible',`${base}.payable`,{type:'checkbox',text:'Include this cost in supplier payables'}):''}${field('Source / notes',`${base}.note`,{type:'textarea',wide:true,help:'Lease quote, supplier quotation, contract or operating estimate.'})}${field('Assumption review',`${base}.reviewed`,{type:'checkbox',text:'I have checked these assumptions'})}</div>${specs[s.type].fields.length?`<details><summary>Year-by-year overrides · optional</summary><p class="subtext">Enter full values, not changes. Blank cells use the starting value and growth. Use this for occupancy or utilization ramp-up.</p>${specs[s.type].fields.map(([k,l,u,min,max])=>`<div style="margin-top:13px;font-size:11px;font-weight:600">${l} · ${u}</div><div class="annual-inputs">${Array.from({length:m.years},(_,j)=>field(String(m.startYear+j),`${base}.overrides.${k}.${j}`,{min,max,optional:true,placeholder:'Auto'})).join('')}</div>`).join('')}</details>`:''}<div class="module-result"><span>Year 1 ${rev?'revenue':'cost'} · ${esc(r.sc.name)}</span><strong>${money(first)}</strong></div><button class="text-button" style="color:var(--red);margin-top:15px" data-delete="${base}">Remove ${rev?'revenue stream':'cost'}</button></div></details></section>`}).join('')||'<div class="empty">Add your first building block to begin.</div>'}`}
function investment(){return head('BUILD YOUR MODEL / 04','Make the funding add up.','Plan what to buy, when to buy it, and how to pay for it.')+card('Equity & cash policy','Equity is money contributed by the project’s owners.',`<div class="form-grid">${field('Planned opening equity','equity',{unit:m.currency})}${field('Minimum cash reserve','minCash',{unit:m.currency,help:'Cash buffer retained after payments and distributions.'})}${field('Fund shortfalls with extra equity','autoEquity',{type:'checkbox',text:'Calculate required additional owner funding',help:'Top-ups are explicit and reduce investor returns. They are not committed finance.'})}${field('Distribute surplus cash','payout',{unit:'%',max:100,help:'Cash above the reserve paid to owners after debt and investment. Legal and loan restrictions are not modeled.'})}</div><div class="module-result"><span>Additional equity required · ${esc(r.sc.name)}</span><strong>${money(r.additionalEquity)}</strong></div>`)+`<div class="heading-row"><div><h2>Capital investment</h2><p class="subtext">Assets purchased in setup (year 0) or later operating years.</p></div><button class="btn" data-action="add-asset">${icon('plus')} Add asset</button></div>${m.assets.map((a,i)=>`<section class="module-card"><details ${i===0?'open':''}><summary class="module-title"><div><strong>${esc(a.name)}</strong><small>${money(a.cost)} · ${a.year===0?'Setup':'Year '+a.year} · ${a.depreciate?a.life+'-year life':'Not depreciated'}</small></div></summary><div class="module-body"><div class="form-grid">${field('Asset name',`assets.${i}.name`,{type:'text'})}${field('Purchase cost',`assets.${i}.cost`,{unit:m.currency})}${field('Purchase & commissioning year',`assets.${i}.year`,{min:0,max:30,step:1,help:'0 = setup; later purchases occur at the beginning of the year.'})}${field('Useful life',`assets.${i}.life`,{unit:'years',min:1,max:100,step:1})}${field('Residual value',`assets.${i}.residual`,{unit:m.currency,max:a.cost,help:'Undepreciated value; not an automatic cash receipt.'})}${field('Depreciate this asset',`assets.${i}.depreciate`,{type:'checkbox',text:'Spread cost over the useful life',help:'Turn off for land. A full year of depreciation begins at commissioning.'})}${field('Maintenance capital expenditure',`assets.${i}.maintenance`,{type:'checkbox',text:'Deduct this purchase from cash available for debt service'})}</div><button class="text-button" style="color:var(--red);margin-top:18px" data-delete="assets.${i}">Remove asset</button></div></details></section>`).join('')||'<div class="empty">Add land, construction, equipment or future replacements.</div>'}<div class="heading-row" style="margin-top:28px"><div><h2>Loans & repayment</h2><p class="subtext">Separate schedules for each loan.</p></div><button class="btn" data-action="add-loan">${icon('plus')} Add loan</button></div>${m.loans.map((l,i)=>`<section class="module-card"><details ${i===0?'open':''}><summary class="module-title"><div><strong>${esc(l.name)}</strong><small>${money(l.amount)} · ${l.rate}% · ${l.term} years</small></div></summary><div class="module-body"><div class="form-grid">${field('Loan name',`loans.${i}.name`,{type:'text'})}${field('Loan amount',`loans.${i}.amount`,{unit:m.currency})}${field('Draw year',`loans.${i}.draw`,{min:0,max:30,step:1,help:'0 = setup; operating draws occur at the start of the year.'})}${field('Annual interest rate',`loans.${i}.rate`,{unit:'%',max:100})}${field('Loan term',`loans.${i}.term`,{unit:'years',min:1,max:30,step:1,help:'Includes grace period. Setup loans begin their term in year 1.'})}${field('Principal grace period',`loans.${i}.grace`,{unit:'years',max:l.term-1,step:1,help:'Interest only in grace, then equal annual principal. No interest in year 0.'})}</div><button class="text-button" style="color:var(--red);margin-top:18px" data-delete="loans.${i}">Remove loan</button></div></details></section>`).join('')||'<div class="empty">No loans. The project is funded by equity.</div>'}`}
function statements(){let body='';if(statementDefs[statement])body=table(statementDefs[statement]);if(statement==='operations')body=r.streams.map(s=>card(esc(s.name),specs[s.type].hint,table([['Revenue','revenue','total'],['Quantity / activity','quantity','','number'],['Input tonnes (processing)','input','','number'],['Waste tonnes (processing)','waste','','number'],['Unit selling price','price'],['Raw material cost','rawCost'],['Processing cost','processCost']],s.values.map((v,i)=>({...v,year:r.rows[i].year}))))).join('')+card('Other operating costs','Annual cost by category',table(r.costs.map(s=>[s.name,(v,i)=>s.values[i]])));
if(statement==='schedules')body=card('Debt schedule','Interest on opening debt plus beginning-of-year draws; principal repaid at year end.',table([['Opening debt','openingDebt'],['New draws','draw'],['Interest','interest'],['Principal repayment','principal'],['Closing debt','debt','total'],['Cash available for debt service','cfads'],['Debt service','debtService'],['DSCR','dscr','total','ratio']]))+r.loans.map(l=>card(esc(l.name),`${l.rate}% interest · ${l.term} years · ${l.grace} years grace`,table([['Opening balance','opening'],['Draws','draw'],['Interest','interest'],['Principal','principal'],['Closing balance','closing','total']],l.values.map((v,i)=>({...v,year:r.rows[i].year}))))).join('')+card('Fixed assets & working capital','Straight-line depreciation and annual working-capital assumptions.',table([['Opening fixed assets','openingPpe'],['Capital expenditure','capex'],['Depreciation','depreciation'],['Closing fixed assets','ppe','total'],['Receivables','ar'],['Inventory','inventory'],['Payables','ap'],['Net working capital','nwc','total'],['Change in working capital','deltaNwc']]))+card('Tax schedule','Simplified loss carryforward when enabled; no tax refund for losses.',table([['Profit before tax','pbt'],['Opening losses','lossOpening'],['Closing losses','lossClosing'],['Cash tax','tax','total'],['Unlevered project tax','projectTax']]));
